services:
  postgres:
    image: postgres:16-alpine
    container_name: backify-postgres
    environment:
      POSTGRES_USER: backify
      POSTGRES_PASSWORD: backify
      POSTGRES_DB: backify_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backify -d backify_control"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: backify-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: backify
      RABBITMQ_DEFAULT_PASS: backify
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
