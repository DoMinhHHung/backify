[project]
name = "control-plane"
version = "0.1.0"
description = "Backify Control Plane - Dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "aio-pika>=9.4.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "grpcio>=1.84.0",
    "protobuf>=5.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "grpcio-tools>=1.84.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 90
src = ["app", "tests"]
extend-exclude = ["app/adapter/grpc/pb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["E501", "S104", "S105", "S106"]

[tool.ruff.lint.isort]
known-third-party = ["grpc"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["N999", "S608"]
"app/adapter/http/schemas.py" = ["N815"]
"app/adapter/grpc/server.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
