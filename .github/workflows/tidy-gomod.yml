name: tidy-gomod
on:
  push:
    branches:
      - bootstrap/service/control-plane
    paths:
      - "services/control-plane/go.mod"
      - ".github/workflows/tidy-gomod.yml"

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: go mod tidy
        run: cd services/control-plane && go mod tidy

      - name: Commit go.sum
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: go mod tidy - generate go.sum"
          file_pattern: "services/control-plane/go.mod services/control-plane/go.sum"