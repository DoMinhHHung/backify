name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/control-plane

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backify
          POSTGRES_PASSWORD: backify
          POSTGRES_DB: backify_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://backify:backify@localhost:5432/backify_control
      JWT_SECRET: ci-secret-that-is-long-enough-for-hs256-check
      INTERNAL_API_KEY: ci-internal-key-that-is-long-enough-check
      RABBITMQ_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  runtime:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/runtime/go.mod
          cache: true

      - run: go mod download
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build -o /tmp/runtime ./cmd/server