services:
  postgres:
    image: postgres:16
    container_name: backify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backify
      POSTGRES_PASSWORD: backify
      POSTGRES_DB: backify
    ports:
      - "5432:5432"
    volumes:
      - backify-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backify -d backify"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-postgres:
    image: postgres:16
    container_name: backify-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backify
      POSTGRES_PASSWORD: backify
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - backify-auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backify -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: backify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: backify-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: backify
      RABBITMQ_DEFAULT_PASS: backify
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: backify-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: backify
      MINIO_ROOT_PASSWORD: backify123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - backify-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backify-postgres-data:
  backify-auth-postgres-data:
  backify-minio-data:
